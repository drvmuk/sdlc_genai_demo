[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdc_account_integration"
version = "0.1.0"
description = "PySpark ETL for Salesforce Account data integration"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/sfdc_account_integration"
"Bug Tracker" = "https://github.com/example/sfdc_account_integration/issues"