[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-processor"
version = "1.0.0"
description = "PySpark job to extract, transform, and load finance data from Everest ECC"
authors = [
    {name = "Finance Data Engineering Team", email = "data-engineering@company.com"}
]
requires-python = ">=3.7"

[project.dependencies]
pyspark = "^3.1.1"
pandas = "^1.3.0"
numpy = "^1.21.0"