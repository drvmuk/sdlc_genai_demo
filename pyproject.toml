[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance_data_processor"
version = "1.0.0"
description = "Finance data processing job for transforming and loading ECC Everest data"
authors = [
    {name = "Finance Data Engineering Team", email = "finance-data@example.com"}
]
readme = "README.md"
requires-python = ">=3.7"

[project.optional-dependencies]
dev = ["pytest", "pytest-spark"]