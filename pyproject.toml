[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_order_processing"
version = "1.0.0"
description = "Customer and Order data processing with SCD Type 2 implementation"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyspark>=3.4.0",
    "delta-spark>=2.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.1",
]

[tool.pytest]
testpaths = ["tests"]