[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqx_custom_rules"
version = "0.1.0"
description = "Custom data quality rules implementation using DQX library"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.dependencies]
databricks-labs-dqx = "0.7.0"
PyYAML = "*"
pyspark = ">=3.3.0"

[tool.pytest]
testpaths = ["tests"]