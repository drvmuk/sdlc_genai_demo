[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r4b_acq_contract_job"
version = "1.0.0"
description = "PySpark job to create and populate the R4B Acquisition Contract Table"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@company.com"}
]
readme = "README.md"
requires-python = ">=3.7"

[project.dependencies]
pyspark = ">=3.0.0"
pytest = ">=6.0.0"