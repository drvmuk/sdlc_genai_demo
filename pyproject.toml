[tool.poetry]
name = "delta-data-processing"
version = "0.1.0"
description = "Delta Lake data processing pipeline for customer and order data"
authors = ["Databricks COE Team <databricks.coe@example.com>"]

[tool.poetry.dependencies]
python = ">=3.8,<3.11"
pyspark = "^3.3.0"
delta-spark = "^2.1.0"
pandas = "^1.5.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
pytest-spark = "^0.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"