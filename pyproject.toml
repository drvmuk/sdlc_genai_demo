[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta_live_tables_pipeline"
version = "0.1.0"
description = "Delta Live Tables Pipeline for Customer and Order Data Processing"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]