[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_order_analytics"
version = "1.0.0"
description = "A Delta Live Tables pipeline for processing customer and order data with SCD Type 2 tracking"
authors = [
    {name = "Data Engineering Team", email = "dataeng@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/customer_order_analytics"
"Bug Tracker" = "https://github.com/example/customer_order_analytics/issues"