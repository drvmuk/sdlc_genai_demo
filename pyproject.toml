[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-order-processing"
version = "0.1.0"
description = "Customer Order Processing Pipeline with Delta Live Tables"
authors = [
    {name = "Data Engineering Team", email = "dataeng@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.dependencies]
pyspark = "^3.3.0"
delta-spark = "^2.2.0"