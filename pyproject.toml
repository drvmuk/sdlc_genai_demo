[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks_etl_pipeline"
version = "0.1.0"
description = "Scalable ETL pipeline using PySpark and Databricks"
authors = [
    {name = "Data Engineering Team", email = "data-engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/databricks_etl_pipeline"
"Bug Tracker" = "https://github.com/example/databricks_etl_pipeline/issues"