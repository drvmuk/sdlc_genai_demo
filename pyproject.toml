[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks_scd_pipeline"
version = "0.1.0"
description = "Databricks Delta Live Tables pipeline for customer and order data processing with SCD Type 2 implementation"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/databricks_scd_pipeline"
"Bug Tracker" = "https://github.com/example/databricks_scd_pipeline/issues"