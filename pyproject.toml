[tool.poetry]
name = "customer-order-data-pipeline"
version = "1.0.0"
description = "A Delta Live Tables pipeline for processing customer and order data"
authors = ["Databricks <info@databricks.com>"]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
pyspark = "^3.3.0"
delta-spark = "^2.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
chispa = "^0.9.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"