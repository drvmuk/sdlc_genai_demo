[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks_etl_pipeline"
version = "0.1.0"
description = "Databricks ETL Pipeline with Delta Live Tables for Customer and Order data"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest>=6.0"]