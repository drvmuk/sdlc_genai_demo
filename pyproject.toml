[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_order_processing"
version = "1.0.0"
description = "Customer Order Processing with Delta Live Tables"
authors = [
    {name = "Data Engineering Team", email = "dataeng@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.dependencies]
pyspark = ">=3.3.1"
delta-spark = ">=2.3.0"

[project.dev-dependencies]
pytest = ">=7.3.1"