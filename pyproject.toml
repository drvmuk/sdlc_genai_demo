[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom_dqx_rules"
version = "0.1.0"
description = "Custom DQX rules for Databricks data quality validation"
authors = [
    {name = "Data Engineering Team", email = "data.engineering@example.com"}
]
requires-python = ">=3.8"

[project.dependencies]
pyspark = ">=3.3.0"
databricks-sdk = "*"
PyYAML = "*"