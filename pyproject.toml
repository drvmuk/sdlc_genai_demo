[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-pipeline"
version = "1.0.0"
description = "Data pipeline to load finance data from ECC Everest into the Finance target table"
authors = [
    {name = "Finance Data Engineering Team", email = "finance-data@company.com"}
]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.dependencies]
pyspark = "^3.1.2"
pandas = "^1.3.5"
numpy = "^1.21.6"
delta-spark = "^1.0.0"

[project.dev-dependencies]
pytest = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"