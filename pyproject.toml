[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_order_data_processing"
version = "1.0.0"
description = "Data processing system for customer and order data using PySpark and Delta Lake"
authors = [
    {name = "Data Engineering Team", email = "data-engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.dependencies]
pyspark = ">=3.3.0"
delta-spark = ">=2.2.0"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest]
testpaths = ["tests"]