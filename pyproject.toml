[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-transformation"
version = "1.0.0"
description = "Finance data transformation from FAGLFLEXA and BSEG tables to Finance table"
authors = [
    {name = "Finance Data Engineering Team", email = "finance-data-eng@example.com"}
]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/example/finance-transformation"
"Bug Tracker" = "https://github.com/example/finance-transformation/issues"