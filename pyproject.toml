[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks_data_processing"
version = "0.1.0"
description = "Data processing pipeline for customer and order data"
authors = [
    {name = "Data Engineering Team", email = "data-engineering@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyspark>=3.1.2",
    "pandas>=1.3.0",
    "delta-spark>=1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0"
]